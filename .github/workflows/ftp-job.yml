name: FTP recommendation job

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run FTP job
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: |
          if [ -z "$STRAVA_CLIENT_ID" ] || [ -z "$STRAVA_CLIENT_SECRET" ] || [ -z "$STRAVA_REFRESH_TOKEN" ]; then
            echo "::notice::Strava secrets are not configured - add STRAVA_CLIENT_ID, STRAVA_CLIENT_SECRET and STRAVA_REFRESH_TOKEN to repository secrets."
            exit 0
          fi
          mkdir -p report
          python -m stravastat.job --days 90 --json report/ftp-report.json

      - name: Send FTP email
        if: hashFiles('report/ftp-report.json') != ''
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -z "$SMTP_HOST" ] || [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASSWORD" ]; then
            echo "::notice::SMTP secrets are not configured - skipping email. Add SMTP_HOST, SMTP_USER and SMTP_PASSWORD to repository secrets."
            exit 0
          fi
          python -m stravastat.email --report report/ftp-report.json --to henrik@aalund.eu

      - name: Upload report
        if: hashFiles('report/ftp-report.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: ftp-report
          path: report/ftp-report.json
